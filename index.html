<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><title>Road Guard</title><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="styles.css?v=%%VERSION%%"></head><body><main class="app-shell"><header class="topbar"><div><h1>Road Guard</h1><p id="statusText">Sẵn sàng</p></div><button id="soundButton" class="icon-button" aria-label="Bật hoặc tắt âm thanh">🔊</button></header><section class="speed-card"><div class="speed-value" id="speedValue">--</div><div class="speed-unit">km/h</div><div class="limit-badge" id="limitBadge">--</div><div class="limit-label">GIỚI HẠN</div></section><section class="camera-card" id="cameraCard"><div class="camera-icon">📷</div><div class="camera-copy"><strong id="cameraTitle">Không có camera gần</strong><span id="cameraDistance">--</span></div></section><section class="info-grid"><article><span>GPS</span><strong id="gpsState">Chưa bật</strong></article><article><span>Hướng</span><strong id="headingValue">--°</strong></article><article><span>Độ chính xác</span><strong id="accuracyValue">-- m</strong></article><article><span>Dữ liệu</span><strong id="dataState">OSM live</strong></article></section><button id="startButton" class="primary-button">Bắt đầu cảnh báo</button><button id="demoButton" class="secondary-button">Chạy chế độ demo</button><p class="hint">Giữ màn hình này mở trên điện thoại thứ hai. Cảnh báo thực tế dùng dữ liệu OpenStreetMap gần vị trí GPS; hãy luôn ưu tiên biển báo giao thông thực tế.</p></main><script type="module" src="app.js?v=%%VERSION%%"></script></body></html>
